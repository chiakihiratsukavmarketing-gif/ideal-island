name: Deploy Supabase Web Push

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy send-schedule-reminders function
        run: supabase functions deploy send-schedule-reminders --project-ref "$SUPABASE_PROJECT_REF"

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="${VAPID_SUBJECT:-mailto:support@ideal-island.vercel.app}" \
            CRON_SECRET="$CRON_SECRET"

      - name: Smoke test function (cron secret)
        run: |
          curl -fsS -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/send-schedule-reminders" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
